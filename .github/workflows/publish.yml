name: Publish

# A v* tag is the release switch: the tag must match package.json, the full verification runs,
# and the single tarball is published to npm. workflow_dispatch allows a dry run (or a real
# publish from the default branch) from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect the package without publishing"
        type: boolean
        default: true

permissions:
  contents: write

# Never run two publishes at once; a second one would fail on an already-published version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @siddharthm28/minions-assembler
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Publishing $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # prepublishOnly runs the full typecheck + both suites; prepack rebuilds dist/ and dist/web.
      # Nothing is uploaded before those pass.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run — publishing nothing"
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi

      - name: Verify the registry serves the version
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=""
          for _ in $(seq 1 12); do
            PUBLISHED=$(npm view "@siddharthm28/minions-assembler@${VERSION}" version 2>/dev/null || true)
            [ "$PUBLISHED" = "$VERSION" ] && break
            sleep 10
          done
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "::error::npm does not serve version $VERSION yet (got '${PUBLISHED}')"
            exit 1
          fi
          TARBALL=$(npm view "@siddharthm28/minions-assembler@${VERSION}" dist.tarball)
          {
            echo "### Published \`@siddharthm28/minions-assembler@${VERSION}\`"
            echo
            echo '```bash'
            echo "npm install -g @siddharthm28/minions-assembler"
            echo "minions-assembler serve --port 3100"
            echo '```'
            echo
            echo "Tarball: $TARBALL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the artifact for the release
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          # dist/ was built by prepack during `npm publish`, so skip the lifecycle scripts here.
          rm -f ./*.tgz
          npm pack --ignore-scripts > /dev/null
          ls -1 ./*.tgz > tarball-name.txt
          cat tarball-name.txt

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "$(cat tarball-name.txt)"
