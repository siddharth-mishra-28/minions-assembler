name: Publish

# A v* tag is the release switch: the tag must match package.json, the full verification runs,
# and the single tarball is published to npm. workflow_dispatch allows a dry run from the
# Actions tab. Re-running a failed job is safe: a version already on the registry is not
# uploaded twice, so the remaining steps (verify, release) still complete.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect the package without publishing"
        type: boolean
        default: true

permissions:
  contents: write

# Never run two publishes at once; a second one would race on the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@siddharthm28/minions-assembler"
  # Scoped names are percent-encoded in registry URLs.
  REGISTRY_URL: "https://registry.npmjs.org/@siddharthm28%2Fminions-assembler"

jobs:
  publish:
    name: Publish @siddharthm28/minions-assembler
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      # Published already? Re-running a partially failed release must not try to upload twice;
      # npm rejects that with a 403 and would hide the steps that still need to run.
      - name: Is this version already on the registry
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          EXISTS=no
          if BODY=$(curl -fsS "$REGISTRY_URL"); then
            # The versions map keys are the only place a version appears as `"1.0.0":{`.
            if printf '%s' "$BODY" | grep -q "\"${VERSION}\":{"; then EXISTS=yes; fi
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "registry already has ${VERSION}: ${EXISTS}"

      # prepublishOnly runs the full typecheck + both suites; prepack rebuilds dist/ and dist/web.
      # Nothing is uploaded before those pass.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.registry.outputs.exists }}" = "yes" ]; then
            echo "::notice::${{ env.PACKAGE_NAME }}@${{ steps.registry.outputs.version }} is already published — skipping the upload"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run — publishing nothing"
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi

      - name: Verify the registry serves the version
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.registry.outputs.version }}"
          BODY=""
          for _ in $(seq 1 20); do
            BODY=$(curl -fsS "$REGISTRY_URL" || true)
            if printf '%s' "$BODY" | grep -q "\"${VERSION}\":{"; then break; fi
            BODY=""
            sleep 15
          done
          if [ -z "$BODY" ]; then
            echo "::error::${PACKAGE_NAME}@${VERSION} is not served by the registry"
            exit 1
          fi
          TARBALL="https://registry.npmjs.org/${PACKAGE_NAME}/-/${PACKAGE_NAME##*/}-${VERSION}.tgz"
          {
            echo "### Published \`${PACKAGE_NAME}@${VERSION}\`"
            echo
            echo '```bash'
            echo "npm install -g ${PACKAGE_NAME}"
            echo "minions-assembler serve --port 3100"
            echo '```'
            echo
            echo "Tarball: ${TARBALL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fetch the artifact the registry serves instead of re-packing the tree, so the release
      # asset is byte-identical to what `npm install` downloads — even on a re-run that skipped
      # the upload.
      - name: Fetch the published tarball for the release
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          rm -f ./*.tgz
          npm pack "${PACKAGE_NAME}@${{ steps.registry.outputs.version }}" > /dev/null
          ls -1 ./*.tgz > tarball-name.txt
          cat tarball-name.txt

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              "$(cat tarball-name.txt)"
          fi
